<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Roomify-3D Image Upload MVP</title>
  <style>
    body { font-family: sans-serif; text-align: center; margin: 50px; }
    img { width: 300px; height: auto; border: 1px solid #ccc; margin-top: 20px; }
  </style>
</head>
<body>
  <h1>Upload a Product Image</h1>
  <input type="file" id="fileInput">
  <button id="uploadBtn">Upload & Preview</button>

  <h2>Preview</h2>
  <img id="preview" alt="Uploaded Image Preview">

  <script>
    const uploadBtn = document.getElementById('uploadBtn');
    const fileInput = document.getElementById('fileInput');
    const preview = document.getElementById('preview');

    uploadBtn.addEventListener('click', async () => {
      if (!fileInput.files.length) return alert('Select a file first');

      const formData = new FormData();
      formData.append('product', fileInput.files[0]);

      try {
        const res = await fetch('http://localhost:3000/upload', {
          method: 'POST',
          body: formData
        });

        const data = await res.json();
        if (data.success) {
          preview.src = data.modelUrl; // show uploaded image
        } else {
          alert('Upload failed');
        }
      } catch (err) {
        console.error(err);
        alert('Server error');
      }
    });
  </script>
</body>
</html>
