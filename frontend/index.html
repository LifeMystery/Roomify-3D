<!-- frontend/index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Roomify 3D MVP</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    body { font-family: sans-serif; text-align: center; margin: 50px; }
    model-viewer { width: 300px; height: 300px; border: 1px solid #ccc; margin-top: 20px; }
  </style>
</head>
<body>
  <h1>Seller Upload</h1>
  <input type="file" id="fileInput">
  <button id="uploadBtn">Upload & Generate 3D</button>

  <h2>3D Preview / AR View</h2>
<!-- Test 3D model to make sure frontend works -->
<!-- <model-viewer id="modelViewer" 
              src="https://modelviewer.dev/shared-assets/models/Chair.glb"
              alt="3D Chair"
              ar ar-modes="webxr scene-viewer quick-look"
              camera-controls auto-rotate
              style="width:300px; height:300px;">
</model-viewer> -->

  <model-viewer id="modelViewer" 
              src="https://modelviewer.dev/shared-assets/models/Chair.glb"
              alt="3D Chair"
              ar ar-modes="webxr scene-viewer quick-look"
              camera-controls auto-rotate
              style="width:300px; height:300px;">
</model-viewer>


  <script>
    const uploadBtn = document.getElementById('uploadBtn');
    const fileInput = document.getElementById('fileInput');
    const modelViewer = document.getElementById('modelViewer');

    uploadBtn.addEventListener('click', async () => {
      if (!fileInput.files.length) return alert('Select a file first');

      const formData = new FormData();
      formData.append('product', fileInput.files[0]);

      try {
        const res = await fetch('http://localhost:3000/upload', {
          method: 'POST',
          body: formData
        });

        const data = await res.json();

        if (data.success) {
          modelViewer.src = data.modelUrl;
        } else {
          alert('Upload or 3D generation failed');
        }
      } catch (err) {
        console.error(err);
        alert('Server error');
      }
    });
  </script>
</body>
</html>
